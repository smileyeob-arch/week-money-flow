name: Collect weekly money flow

on:
  schedule:
    # 평일 한국시간 16:30 (UTC 07:30)
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiwoom-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Collect Kiwoom data
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        run: python collector/collect_kiwoom.py
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly.json data/daily/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Kiwoom weekly money flow data"
            git push
          fi
